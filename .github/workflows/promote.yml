# =============================================================================
# SleepReach — Auto-Promote & Deploy (DISABLED)
#
# THIS WORKFLOW IS DISABLED as of 2026-04-21.
#
# REASON: Replaced by controlled branch-triggered deploys:
#   - Push/merge to `stg` → deploy-staging.yml runs automatically
#   - Push/merge to `main` → deploy-production.yml runs automatically
#
# OLD BEHAVIOR (removed):
#   Push to dev → CI → auto-merge dev→stg → deploy staging →
#   auto-merge stg→main → deploy production (all automatic, no gate)
#
# NEW WORKFLOW:
#   1. Developer pushes to dev → CI runs (lint + test)
#   2. Developer merges dev → stg (PR or direct) → staging deploys
#   3. Developer verifies staging
#   4. Developer merges stg → main (PR) → production deploys
#
# See deploy-staging.yml and deploy-production.yml for active workflows.
# =============================================================================
name: "[DISABLED] Promote & Deploy All"

on:
  workflow_dispatch:
    inputs:
      note:
        description: "This workflow is disabled. Use branch merges instead. Merge dev→stg for staging, stg→main for production."
        required: false
        type: string

jobs:
  disabled-notice:
    name: "⛔ Workflow Disabled"
    runs-on: ubuntu-latest
    steps:
      - name: Show disabled notice
        run: |
          echo "## ⛔ This Workflow is Disabled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The auto-promote pipeline has been replaced by controlled branch-triggered deploys:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Action | How |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to **Staging** | Merge \`dev → stg\` branch |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to **Production** | Merge \`stg → main\` branch |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | Use the 🔄 Rollback Production workflow |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`deploy-staging.yml\` and \`deploy-production.yml\` for the active workflows." >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "❌ This workflow is disabled. Use branch merges instead."
          echo "   - Merge dev → stg for staging deployment"
          echo "   - Merge stg → main for production deployment"
