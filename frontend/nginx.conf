# =============================================================================
# SleepReach Frontend — Nginx Configuration (Production)
# =============================================================================
# Serves the Vite-built SPA with:
#   • SPA fallback (try_files → index.html)
#   • Gzip compression for text assets
#   • Cache-busting headers for hashed assets
#   • Security headers (XSS, clickjacking, MIME-sniff)
#   • Health check endpoint for ALB
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health Check Endpoint (for ALB) ───────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    # ── Hashed Assets (long-lived cache) ──────────────────────────────────
    # Vite outputs files like /assets/index-DDZ9kwe_.js with content hashes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Static Assets (favicon, images, etc.) ─────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── SPA Fallback ──────────────────────────────────────────────────────
    # Any route that doesn't match a static file falls back to index.html
    # This supports both hash (#/) and history-mode routing
    location / {
        try_files $uri $uri/ /index.html;

        # No cache for index.html itself (always get latest deploy)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Disable Logging for Favicon ───────────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # ── Deny Hidden Files ─────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
