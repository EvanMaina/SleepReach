# =============================================================================
# SleepReach — Docker Compose (Development)
# =============================================================================
# Usage:
#   docker compose up              — start all services
#   docker compose up -d           — start detached
#   docker compose down            — stop all
#   docker compose logs -f backend — follow backend logs
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:14.15-alpine
    container_name: sleepreach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sleepreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sleepreach_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sleepreach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200
      -c idle_in_transaction_session_timeout=30000
      -c statement_timeout=30000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sleepreach} -d ${POSTGRES_DB:-sleepreach}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: sleepreach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --save 900 1
      --save 300 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sleepreach-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sleepreach}:${POSTGRES_PASSWORD:-sleepreach_dev_password}@db:5432/${POSTGRES_DB:-sleepreach}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SMS_LOCAL_URL=http://smsdev:1081
      - PYTHONUNBUFFERED=1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/static:/app/static
      - ./backend/scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - data
      - backend

  # ---------------------------------------------------------------------------
  # React Frontend (Dev server with hot-reload)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sleepreach-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      - backend
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sleepreach-celery-worker
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sleepreach}:${POSTGRES_PASSWORD:-sleepreach_dev_password}@db:5432/${POSTGRES_DB:-sleepreach}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - BACKEND_URL=http://backend:8000
      - SMS_LOCAL_URL=http://smsdev:1081
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PYTHONPATH=/app /opt/venv/bin/celery -A src.tasks.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    networks:
      - data
      - backend

  # ---------------------------------------------------------------------------
  # Celery Beat
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sleepreach-celery-beat
    restart: unless-stopped
    command: celery -A src.tasks.celery_app beat --loglevel=info --schedule=/var/run/celery/celerybeat-schedule
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sleepreach}:${POSTGRES_PASSWORD:-sleepreach_dev_password}@db:5432/${POSTGRES_DB:-sleepreach}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend/src:/app/src:ro
      - celerybeat_schedule:/var/run/celery
    depends_on:
      - celery-worker
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; import time, sys; p = Path('/var/run/celery/celerybeat-schedule'); sys.exit(0 if p.exists() and (time.time() - p.stat().st_mtime) < 900 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - data

  # ---------------------------------------------------------------------------
  # SMS Dev Server
  # ---------------------------------------------------------------------------
  smsdev:
    build:
      context: ./scripts
      dockerfile: Dockerfile.smsdev
    container_name: sleepreach-smsdev
    restart: unless-stopped
    ports:
      - "1081:1081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Maildev — Local Email Testing
  # ---------------------------------------------------------------------------
  maildev:
    image: maildev/maildev:2.1.0
    container_name: sleepreach-maildev
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
    environment:
      - MAILDEV_INCOMING_USER=
      - MAILDEV_INCOMING_PASS=
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:1080"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celerybeat_schedule:
    driver: local

networks:
  backend:
    name: sleepreach-backend
  data:
    name: sleepreach-data
